[package]
name = "ferrite-lithic-derive"
description = "#[derive(PortList)] for the Ferrite Lithic hardware DSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
ferrite-lithic = { path = "../ferrite-lithic", version = "0.0.1" }
ferrite-lithic-rtl = { path = "../ferrite-lithic-rtl", version = "0.0.1" }
