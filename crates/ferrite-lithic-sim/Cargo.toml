[package]
name = "ferrite-lithic-sim"
description = "The cycle simulator for Ferrite Lithic: compile a circuit to word-addressed ops and step it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ferrite-lithic.workspace = true
ferrite-lithic-bits.workspace = true
ferrite-lithic-ir.workspace = true

[dev-dependencies]
# The README's doctests live here (see the `ReadmeExamples` target in `src/lib.rs`),
# so every crate the README mentions has to be visible to them. A *dev*-dependency
# is what makes that true without the simulator depending on another backend.
ferrite-lithic-cosim.workspace = true
ferrite-lithic-derive.workspace = true
ferrite-lithic-rtl.workspace = true
ferrite-lithic-wave.workspace = true
proptest = "1.11"
