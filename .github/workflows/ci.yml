name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: this repo is small and a stale run is
# never useful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fails CI on warnings anywhere, which is what makes the lint table in
  # Cargo.toml load-bearing rather than decorative.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show
        run: rustup show active-toolchain
      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features --locked

  # The crate declares rust-version 1.97 and pins an exact channel in
  # rust-toolchain.toml. This job checks the *minimum* declared version still
  # builds, which is a different promise from "the pinned version builds".
  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features --locked

  # The gates that need a vendor toolchain, in a job where the toolchain is
  # *required* rather than looked for.
  #
  # Every other job runs with neither `verilator` nor `iverilog` installed, so both
  # print their skip and the suite is green either way. That is the right default --
  # a hard dependency on a vendor tool would make the suite unrunnable -- but it
  # means the ordinary `test` job does not check the one thing a hardware DSL is
  # mostly wrong about: whether the Verilog it emits behaves like the design.
  #
  # So this job installs both, and then asserts that *nothing skipped*. The grep is
  # the point. Without it the job would pass on a runner where the install silently
  # failed and every equivalence test took its skip path -- green, and meaningless.
  cosim:
    name: cosim (verilator + iverilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install verilator and iverilog
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator iverilog
      - name: tool versions
        run: |
          verilator --version
          iverilog -V | head -1
      - name: random-design equivalence
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-cosim --test equivalence --all-features --locked \
            -- --nocapture 2>&1 | tee /tmp/equivalence.txt
      - name: corpus equivalence
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-corpus --all-features --locked -- --nocapture 2>&1 \
            | tee /tmp/corpus.txt
      - name: the iCarus syntax gate
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-rtl --test iverilog --all-features --locked \
            -- --nocapture 2>&1 | tee /tmp/iverilog.txt
      - name: nothing may have skipped
        run: |
          if grep -q SKIPPED /tmp/equivalence.txt /tmp/corpus.txt /tmp/iverilog.txt; then
            echo "::error::a testbench-gated test skipped, so this job proved nothing"
            grep -n SKIPPED /tmp/equivalence.txt /tmp/corpus.txt /tmp/iverilog.txt
            exit 1
          fi
          echo "every gated test ran"

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
